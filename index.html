<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Que Laura Não Gosta?</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffb6c1;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:#fff;
    width:320px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}
h1{
    color:#e91e63;
    font-size:28px;
}
#comida{
    font-size:30px;
    margin:30px 0;
    font-weight:bold;
}
button{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}
#gosta{
    background:#4CAF50;
    color:white;
}
#nao{
    background:#F44336;
    color:white;
}
#msg{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
}
#pontos{
    margin-top:10px;
}
</style>

</head>
<body>

<div class="card">

<h1>🍔 O Que Laura Não Gosta?</h1>

<div id="comida"></div>

<button id="gosta">👍 Gosta</button>
<button id="nao">👎 Não Gosta</button>

<div id="msg"></div>

<h2 id="pontos">Pontos: 0</h2>

</div>

<script>

const lista=[

["Pizza",true],
["Hambúrguer",true],
["Lasanha",true],
["Batata Frita",true],
["Brigadeiro",true],
["Açaí",true],
["Cuscuz",true],
["Feijoada",true],
["Sushi",false],
["Jiló",false],
["Quiabo",false],
["Fígado",false],
["Azeitona",false],
["Mostarda",false],
["Berinjela",false],
["Ervilha",false]

];

let pontos=0;
let atual;

function nova(){

atual=lista[Math.floor(Math.random()*lista.length)];

document.getElementById("comida").innerHTML=atual[0];
document.getElementById("msg").innerHTML="";

}

function jogar(resp){

if(resp==atual[1]){
document.getElementById("msg").innerHTML="✅ Acertou!";
pontos++;
}else{
document.getElementById("msg").innerHTML="❌ Errou!";
}

document.getElementById("pontos").innerHTML="Pontos: "+pontos;

setTimeout(nova,800);

}

document.getElementById("gosta").onclick=()=>jogar(true);
document.getElementById("nao").onclick=()=>jogar(false);

nova();

</script>

</body>
</html>
